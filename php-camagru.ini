; Camagru - límites y sesión
upload_max_filesize = 32M		; Tamaño máximo de archivo subido
post_max_size = 64M				; Tamaño máximo de datos POST, incluyendo archivos subidos
memory_limit = 256M				; Límite de memoria para scripts PHP
max_execution_time = 120		; Tiempo máximo de ejecución de un script
max_input_time = 120			; Tiempo máximo de entrada de datos

; Sesiones estables dentro del contenedor
session.save_path = "/var/lib/php/sessions"		
; Directorio para almacenar sesiones del contenedor, asegurando que las sesiones persistan mientras el contenedor esté activo
session.cookie_httponly = 1		
; El 1 indica que la cookie de sesión solo es accesible a través de HTTP(S), no por JavaScript
; Esto ayuda a proteger contra ataques XSS, evitando que scripts maliciosos accedan a la cookie de sesión
session.cookie_samesite = Lax	
; samesite=Lax ayuda a proteger contra ataques CSRF, permitiendo que la cookie se envíe solo en solicitudes de primer nivel
; o sea cuando el usuario navega directamente al sitio, pero no en solicitudes de terceros
session.use_strict_mode = 1		
; strict_mode asegura que las sesiones solo se acepten si fueron iniciadas por el servidor, evitando fijación de sesión
; el 1 indica que se habilita el modo estricto

; Este archivo es un ejemplo de configuración de PHP para el proyecto Camagru.
; Puedes personalizarlo según las necesidades de tu entorno.
; Se usará como base para la configuración de PHP en el contenedor Docker.
; Se le llama desde Dockerfile (línea: 46) con la instrucción COPY para 
; reemplazar el archivo php.ini predeterminado de PHP. 
